name: Verify public Windows update
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version to verify
        required: true
        default: '2.0.10'
permissions:
  contents: read
jobs:
  public-download-and-install:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      LWANG_VERSION: ${{ inputs.version }}
    steps:
      - name: Download without authentication and verify checksum
        shell: pwsh
        run: |
          $version = $env:LWANG_VERSION
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          $base = "https://github.com/Fabian345/LWang-releases/releases/download/lwang-v$version"
          $name = "lwang-harness-$version-win32-x64.exe"
          $installer = Join-Path $env:RUNNER_TEMP $name
          $sums = (Invoke-WebRequest "$base/SHA256SUMS").Content
          if ($sums -is [byte[]]) { $sums = [Text.Encoding]::UTF8.GetString($sums) }
          $line = @($sums -split '\r?\n' | Where-Object { $_ -match ('^[a-f0-9]{64}  ' + [regex]::Escape($name) + '$') })
          if ($line.Count -ne 1) { throw 'Expected exactly one installer checksum' }
          Invoke-WebRequest "$base/$name" -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $line[0].Substring(0, 64)) { throw 'Checksum mismatch' }
          "LWANG_INSTALLER=$installer" >> $env:GITHUB_ENV
          Write-Output "Public installer checksum verified: $actual"
      - name: Verify the installed 2.0.9 client can discover and download this update
        shell: pwsh
        run: |
          $base = 'https://github.com/Fabian345/LWang-releases/releases/download/lwang-v2.0.9'
          $oldName = 'lwang-harness-2.0.9-win32-x64.exe'
          $oldInstaller = Join-Path $env:RUNNER_TEMP $oldName
          $sums = (Invoke-WebRequest "$base/SHA256SUMS").Content
          if ($sums -is [byte[]]) { $sums = [Text.Encoding]::UTF8.GetString($sums) }
          $line = @($sums -split '\r?\n' | Where-Object { $_ -match ('^[a-f0-9]{64}  ' + [regex]::Escape($oldName) + '$') })
          if ($line.Count -ne 1) { throw 'Missing old installer checksum' }
          Invoke-WebRequest "$base/$oldName" -OutFile $oldInstaller
          if ((Get-FileHash $oldInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $line[0].Substring(0,64)) { throw 'Old installer checksum mismatch' }
          $installDir = Join-Path $env:RUNNER_TEMP 'LWangPublicInstall'
          $process = Start-Process -FilePath $oldInstaller -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Old installer failed' }
          $dataDir = Join-Path $env:APPDATA 'lwang-harness'
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          'preserve-across-update' | Set-Content (Join-Path $dataDir 'release-verification.txt')
          $probe = Join-Path $env:RUNNER_TEMP 'verify-old-updater.cjs'
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const assert = require('node:assert/strict');
          (async () => {
            const asar = path.join(process.argv[2], 'resources', 'app.asar');
            const pkg = JSON.parse(fs.readFileSync(path.join(asar, 'package.json'), 'utf8'));
            assert.equal(pkg.version, '2.0.9');
            const lib = path.join(asar, 'lib');
            async function exported(prefix, name) {
              const chunks = fs.readdirSync(lib).filter(file => file.startsWith(prefix + '-') && file.endsWith('.js'));
              assert.equal(chunks.length, 1);
              const file = path.join(lib, chunks[0]);
              const code = fs.readFileSync(file, 'utf8');
              const alias = code.match(new RegExp(name + ' as ([A-Za-z_$][A-Za-z0-9_$]*)'));
              assert.ok(alias, name + ' export missing');
              return (await import(pathToFileURL(file).href))[alias[1]];
            }
            const check = await exported('lwang-release', 'checkForLwangUpdate');
            const release = await (await exported('lwang-release', 'fetchLwangRelease'))('stable', globalThis.fetch);
            const request = await exported('lwang-release', 'requestLwangReleaseUrl');
            const options = { channel: 'stable', currentChannel: 'stable', platform: 'win32', arch: 'x64', request: globalThis.fetch };
            const result = await check({ ...options, currentVersion: pkg.version });
            assert.equal(result?.status, 'update-available');
            assert.equal(result?.latestVersion, process.env.LWANG_VERSION);
            const destinationPath = path.join(process.env.RUNNER_TEMP, 'old-client-verified-update.exe');
            const artifact = release.assets.find(asset => asset.platform === 'win32' && asset.arch === 'x64');
            assert.ok(artifact);
            const response = await request(artifact.url, {}, globalThis.fetch);
            assert.equal(response.status, 200);
            const bytes = Buffer.from(await response.arrayBuffer());
            assert.equal(bytes.length, artifact.size);
            assert.equal(bytes.subarray(0, 2).toString('ascii'), 'MZ');
            fs.writeFileSync(destinationPath, bytes);
            const crypto = require('node:crypto');
            const hash = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            assert.equal(hash(destinationPath), artifact.sha256);
            assert.equal(hash(destinationPath), hash(process.env.LWANG_INSTALLER));
            console.log(JSON.stringify({ installedVersion: pkg.version, targetVersion: result.latestVersion, oldClientDetectedUpdateAndVerifiedArtifact: true }));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          '@ | Set-Content $probe -Encoding utf8
          $env:ELECTRON_RUN_AS_NODE = '1'
          $stdout = Join-Path $env:RUNNER_TEMP 'old-updater.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'old-updater.stderr.log'
          $exe = Join-Path $installDir 'lwang-harness.exe'
          $probeProcess = Start-Process -FilePath $exe -ArgumentList "`"$probe`" `"$installDir`"" -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout
          Get-Content $stderr
          if ($probeProcess.ExitCode -ne 0) { throw 'Old installed updater failed' }
          $result = Get-Content $stdout | Where-Object { $_ -match '^\{' } | Select-Object -Last 1 | ConvertFrom-Json
          if (!$result.oldClientDetectedUpdateAndVerifiedArtifact) { throw 'Old updater verification result missing' }
          "LWANG_INSTALLER=$(Join-Path $env:RUNNER_TEMP 'old-client-verified-update.exe')" >> $env:GITHUB_ENV
      - name: Install and check the packaged update client
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'LWangPublicInstall'
          $process = Start-Process -FilePath $env:LWANG_INSTALLER -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exit code: $($process.ExitCode)" }
          if ((Get-Content (Join-Path $env:APPDATA 'lwang-harness/release-verification.txt')).Trim() -ne 'preserve-across-update') { throw 'Upgrade removed the existing data marker' }
          $exe = Join-Path $installDir 'lwang-harness.exe'
          if (!(Test-Path $exe)) { throw 'Installed application missing' }
          $probe = Join-Path $env:RUNNER_TEMP 'verify-installed-updater.cjs'
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const assert = require('node:assert/strict');
          (async () => {
            const asar = path.join(process.argv[2], 'resources', 'app.asar');
            const version = process.env.LWANG_VERSION;
            const pkg = JSON.parse(fs.readFileSync(path.join(asar, 'package.json'), 'utf8'));
            assert.equal(pkg.version, version);
            const lib = path.join(asar, 'lib');
            const chunks = fs.readdirSync(lib).filter(name => /^lwang-release-.*\.js$/.test(name));
            assert.equal(chunks.length, 1);
            const chunk = path.join(lib, chunks[0]);
            const code = fs.readFileSync(chunk, 'utf8');
            assert.ok(code.includes('Fabian345/LWang-releases'));
            const alias = code.match(/checkForLwangUpdate as (\w+)/);
            assert.ok(alias, 'Packaged update checker export missing');
            const module = await import(pathToFileURL(chunk).href);
            const check = module[alias[1]];
            const options = { channel: 'stable', currentChannel: 'stable', platform: 'win32', arch: 'x64', request: globalThis.fetch };
            const current = await check({ ...options, currentVersion: version });
            assert.equal(current?.status, 'up-to-date');
            assert.equal(current?.latestVersion, version);
            const older = await check({ ...options, currentVersion: '0.0.0' });
            assert.equal(older?.status, 'update-available');
            assert.equal(older?.latestVersion, version);
            console.log(JSON.stringify({ version, installed: true, anonymousChannel: true, currentVersionCheck: current.status, olderVersionCheck: older.status }));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          '@ | Set-Content $probe -Encoding utf8
          $env:ELECTRON_RUN_AS_NODE = '1'
          $stdout = Join-Path $env:RUNNER_TEMP 'updater-probe.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'updater-probe.stderr.log'
          $probeProcess = Start-Process -FilePath $exe -ArgumentList "`"$probe`" `"$installDir`"" -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout
          Get-Content $stderr
          if ($probeProcess.ExitCode -ne 0) { throw "Installed updater verification failed: $($probeProcess.ExitCode)" }
          $result = Get-Content $stdout | Where-Object { $_ -match '^\{' } | Select-Object -Last 1 | ConvertFrom-Json
          if (!$result.installed -or !$result.anonymousChannel) { throw 'Updater verification result missing' }
